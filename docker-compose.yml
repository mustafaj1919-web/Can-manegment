services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: car-showroom-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-showroom_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Aldulimi99_secure_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-showroom_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - showroom-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-showroom_admin} -d $${POSTGRES_DB:-showroom_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Flask Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: car-showroom-backend
    expose:
      - "5000"
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-showroom_admin}:${POSTGRES_PASSWORD:-Aldulimi99_secure_db_pass}@db:5432/${POSTGRES_DB:-showroom_production}
      - SECRET_KEY=${SECRET_KEY:-f7de9d81d2938e2d26f634bc3d84fde92d83ab945a0d3bc891f7c81a28a2b53e}
      - CLOUD_MODE=1
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - UPLOAD_FOLDER=/app/static/uploads
      - PRIVATE_STORAGE_FOLDER=/app/storage/private
      - BACKUP_FOLDER=/app/data/backups
      - PROXY_FIX_X_FOR=1
      - PROXY_FIX_X_PROTO=1
      - PROXY_FIX_X_HOST=1
    volumes:
      - customer_uploads:/app/static/uploads
      - private_storage:/app/storage/private
      - app_backups:/app/data/backups
      - app_logs:/app/logs
    networks:
      - showroom-network
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: car-showroom-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FLASK_BACKEND_URL=http://backend:5000
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=production
    networks:
      - showroom-network
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  customer_uploads:
    driver: local
  private_storage:
    driver: local
  app_backups:
    driver: local
  app_logs:
    driver: local

networks:
  showroom-network:
    driver: bridge
