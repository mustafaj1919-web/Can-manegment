services:
  v2-postgres-db:
    image: postgres:16-alpine
    container_name: v2-postgres-db
    environment:
      POSTGRES_DB: CarShowroomV2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - v2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CarShowroomV2"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - v2-network
    restart: unless-stopped

  v2-enterprise-api:
    image: carshowroom-v2-api:latest
    container_name: v2-enterprise-api
    build:
      context: .
      dockerfile: src/API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=v2-postgres-db;Database=CarShowroomV2;Username=postgres;Password=postgres_password
      - JwtSettings__Secret=${JWT_SECRET:?JWT_SECRET is required}
      - JwtSettings__Issuer=CarShowroomEnterprise
      - JwtSettings__Audience=CarShowroomEnterpriseUsers
      - AdminSettings__InitialPassword=${ADMIN_INITIAL_PASSWORD:-Admin@Showroom2024!}
      - AdminSettings__ForceResetPassword=${RESET_ADMIN_PASSWORD:-false}
      - Cors__AllowedOrigins__0=http://localhost
      - Cors__AllowedOrigins__1=http://localhost:3000
      - Cors__AllowedOrigins__2=http://localhost:80
      - Cors__AllowedOrigins__3=https://alsadaka.com
      - Cors__AllowedOrigins__4=https://www.alsadaka.com
      - Cors__AllowedOrigins__5=${SERVER_URL:-http://192.168.68.200}
      - Cors__AllowedOrigins__6=${SERVER_URL_HTTPS:-https://192.168.68.200}
      - AllowedHosts=*
    volumes:
      - v2_vehicle_photos:/app/storage/vehicles
      - v2_dataprotection_keys:/home/appuser/.aspnet/DataProtection-Keys
    depends_on:
      v2-postgres-db:
        condition: service_healthy
    networks:
      - v2-network
    restart: unless-stopped

  v2-enterprise-frontend:
    image: carshowroom-v2-frontend:latest
    container_name: v2-enterprise-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://v2-enterprise-api:8080
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - v2-enterprise-api
    networks:
      - v2-network
    restart: unless-stopped

  v2-nginx:
    image: nginx:1.27-alpine
    container_name: v2-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - v2-enterprise-frontend
      - v2-enterprise-api
    networks:
      - v2-network
    restart: unless-stopped

volumes:
  v2_postgres_data:
  v2_vehicle_photos:
  v2_dataprotection_keys:

networks:
  v2-network:
    name: v2-enterprise-network
    driver: bridge
