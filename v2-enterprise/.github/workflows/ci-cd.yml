name: Car Showroom Management v2 Enterprise CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'v2-enterprise/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'v2-enterprise/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore v2-enterprise/CarShowroomManagementV2.sln

    - name: Build Solution
      run: dotnet build v2-enterprise/CarShowroomManagementV2.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test v2-enterprise/CarShowroomManagementV2.sln --configuration Release --no-build --verbosity normal

    - name: Verify Docker API Build
      run: |
        cd v2-enterprise
        docker build -t carshowroom-v2-api:test -f src/API/Dockerfile .
