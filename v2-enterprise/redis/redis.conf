# Redis Production Configuration
# Car Showroom V2 Enterprise

# Networking — bind to Docker internal only, block external access
bind 127.0.0.1
port 6379
protected-mode yes

# Security Hardening - Rename dangerous commands
rename-command FLUSHALL "SECURE_FLUSHALL"
rename-command FLUSHDB "SECURE_FLUSHDB"
rename-command CONFIG "SECURE_CONFIG"
rename-command SHUTDOWN "SECURE_SHUTDOWN"

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (Disabled for pure cache, can be enabled if needed)
save ""
appendonly no

# Logging & Monitoring
loglevel notice
databases 16
