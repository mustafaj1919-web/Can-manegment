user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server_tokens off;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ─────────────────────────────────────────────────────────────────────
    # WEBSITE — al-asdiqa.com  →  v2-public-website container (Next.js, port 3004)
    # SSL cert:  /etc/nginx/certs/al-asdiqa.crt
    # Obtain:    certbot certonly --nginx -d al-asdiqa.com -d www.al-asdiqa.com
    #            OR: openssl req -x509 -newkey rsa:4096 -sha256 -days 1095 -nodes \
    #                  -keyout nginx/certs/al-asdiqa.key \
    #                  -out nginx/certs/al-asdiqa.crt \
    #                  -subj "/CN=al-asdiqa.com" \
    #                  -addext "subjectAltName=DNS:al-asdiqa.com,DNS:www.al-asdiqa.com"
    # ─────────────────────────────────────────────────────────────────────

    server {
        listen 80;
        server_name al-asdiqa.com www.al-asdiqa.com;
        return 301 https://al-asdiqa.com$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name al-asdiqa.com www.al-asdiqa.com;

        ssl_certificate     /etc/nginx/certs/al-asdiqa.crt;
        ssl_certificate_key /etc/nginx/certs/al-asdiqa.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $website http://v2-public-website:3004;

        location / {
            proxy_pass $website$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ─────────────────────────────────────────────────────────────────────
    # ERP ADMIN — admin.al-asdiqa.com  →  v2-enterprise-frontend (port 3000)
    # Also handles: alsadaka.com, www.alsadaka.com, localhost, Tailscale IP
    # SSL cert:  /etc/nginx/certs/alsadaka.crt  (covers alsadaka.com + localhost)
    # NOTE: admin.al-asdiqa.com will show a cert warning until you add that
    #       domain to the cert SANs. Quick fix:
    #       openssl req -x509 -newkey rsa:4096 -sha256 -days 1095 -nodes \
    #         -keyout nginx/certs/alsadaka.key \
    #         -out nginx/certs/alsadaka.crt \
    #         -subj "/CN=admin.al-asdiqa.com" \
    #         -addext "subjectAltName=DNS:admin.al-asdiqa.com,DNS:alsadaka.com,DNS:www.alsadaka.com,DNS:localhost,IP:127.0.0.1"
    # ─────────────────────────────────────────────────────────────────────

    server {
        listen 80 default_server;
        server_name admin.al-asdiqa.com alsadaka.com www.alsadaka.com localhost 127.0.0.1;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_api http://v2-enterprise-api:8080;

        location = /ca.crt {
            alias /etc/nginx/certs/AlsadakaCA.crt;
            add_header Content-Type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="AlsadakaCA.crt"';
        }

        # Allow API on HTTP for Expo mobile app
        location /api/ {
            proxy_pass $backend_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Allow vehicle photo downloads on HTTP for Expo
        location /static/ {
            proxy_pass $backend_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        location /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name admin.al-asdiqa.com alsadaka.com www.alsadaka.com localhost 127.0.0.1;

        ssl_certificate     /etc/nginx/certs/alsadaka.crt;
        ssl_certificate_key /etc/nginx/certs/alsadaka.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_api  http://v2-enterprise-api:8080;
        set $frontend_app http://v2-enterprise-frontend:3000;

        location / {
            proxy_pass $frontend_app$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ai/chat {
            proxy_pass $frontend_app$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # SSE Configuration (disable buffering for streaming responses)
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass $backend_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /static/ {
            proxy_pass $backend_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location /swagger/ {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;

            proxy_pass $backend_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /healthz {
            proxy_pass $backend_api/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy';
        }
    }

}
