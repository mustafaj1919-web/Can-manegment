name: alasdeqa_auto
description: "Al-Asdeqa Auto - Car Showroom & Installments Management System mobile app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & Graphics
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  flutter_lucide: any

  # Networking & Storage
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  google_sign_in: ^6.2.2

  # Utilities
  url_launcher: ^6.2.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
