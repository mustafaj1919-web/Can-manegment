apiVersion: v1
kind: Namespace
metadata:
  name: showroom-enterprise
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-configmap
  namespace: showroom-enterprise
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  JwtSettings__Issuer: "CarShowroomEnterprise"
  JwtSettings__Audience: "CarShowroomEnterpriseUsers"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: showroom-enterprise
type: Opaque
data:
  # كلمات مرور مشفرة Base64
  # DB Password: postgres_password -> cG9zdGdyZXNfcGFzc3dvcmQ=
  # JWT SecretKey -> c3VwZXJfc2VjcmV0X2VudGVycHJpc2Vfa2V5X3YyX3RoYXRfbXVzdF9iZV9sb25nX2Vub3VnaA==
  db-password: cG9zdGdyZXNfcGFzc3dvcmQ=
  jwt-secret: c3VwZXJfc2VjcmV0X2VudGVycHJpc2Vfa2V5X3YyX3RoYXRfbXVzdF9iZV9sb25nX2Vub3VnaA==
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: showroom-enterprise
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
  clusterIP: None # Headless service for statefulset
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: showroom-enterprise
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: CarShowroomV2
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: db-password
          volumeMounts:
            - name: postgres-persistent-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-persistent-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: showroom-enterprise
spec:
  ports:
    - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: showroom-enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: showroom-enterprise
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: showroom-api
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showroom-api
  namespace: showroom-enterprise
spec:
  replicas: 2 # تواجدية عالية بنسختين متوازيتين
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: showroom-api
  template:
    metadata:
      labels:
        app: showroom-api
    spec:
      containers:
        - name: showroom-api
          image: carshowroom-v2-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "250m"
              memory: 512Mi
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: api-configmap
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres-service;Database=CarShowroomV2;Username=postgres;Password=postgres_password
            - name: JwtSettings__Issuer
              valueFrom:
                configMapKeyRef:
                  name: api-configmap
                  key: JwtSettings__Issuer
            - name: JwtSettings__Audience
              valueFrom:
                configMapKeyRef:
                  name: api-configmap
                  key: JwtSettings__Audience
            - name: JwtSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-ingress
  namespace: showroom-enterprise
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: api.showroom-v2.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80
