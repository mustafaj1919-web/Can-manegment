services:
  v2-postgres-db:
    image: postgres:16-alpine
    container_name: v2-postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - v2_prod_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - v2-prod-network

  v2-redis-cache:
    image: redis:7-alpine
    container_name: v2-redis-cache
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - v2_prod_redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - v2-prod-network

  v2-enterprise-api:
    image: carshowroom-v2-api:latest
    container_name: v2-enterprise-api
    build:
      context: .
      dockerfile: src/API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_AllowedHosts=*
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - AdminSettings__InitialPassword=${ADMIN_INITIAL_PASSWORD}
      - AdminSettings__ForceResetPassword=${RESET_ADMIN_PASSWORD:-false}
    depends_on:
      v2-postgres-db:
        condition: service_healthy
      v2-redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - v2-prod-network

  v2-enterprise-frontend:
    image: carshowroom-v2-frontend:latest
    container_name: v2-enterprise-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://v2-enterprise-api:8080
    depends_on:
      v2-enterprise-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (res) => [200, 302, 307].includes(res.statusCode) ? process.exit(0) : process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - v2-prod-network

  v2-nginx-proxy:
    image: nginx:alpine
    container_name: v2-nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      v2-enterprise-api:
        condition: service_healthy
      v2-enterprise-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - v2-prod-network

volumes:
  v2_prod_postgres_data:
    driver: local
  v2_prod_redis_data:
    driver: local

networks:
  v2-prod-network:
    name: v2-prod-network
    driver: bridge
