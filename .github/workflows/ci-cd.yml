name: V2 Enterprise CI

# يعمل فقط على برانش v2-enterprise المستقل (نظام منفصل عن المشروع القديم في main/master)
on:
  push:
    branches: [ v2-enterprise ]
    paths:
      - 'v2-enterprise/**'
  pull_request:
    branches: [ v2-enterprise ]
    paths:
      - 'v2-enterprise/**'

jobs:
  # الباك إند: .NET 8 — بناء الحل (Release)
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore v2-enterprise/CarShowroomManagementV2.sln

      - name: Build (Release)
        run: dotnet build v2-enterprise/CarShowroomManagementV2.sln --configuration Release --no-restore

  # الفرونت إند: Next.js 16 — بناء الإنتاج
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2-enterprise/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./v2-enterprise/frontend
        run: npm ci

      - name: Build Next.js (production)
        working-directory: ./v2-enterprise/frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
